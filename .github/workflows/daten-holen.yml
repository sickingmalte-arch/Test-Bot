# VORÜBERGEHEND: holt einmal echte Kursdaten für Strategie-Tests (wird vor dem Pull Request wieder entfernt).
name: Testdaten holen
on:
  push:
    branches: [claude/new-session-hbq1tg]
    paths: [.github/workflows/daten-holen.yml]
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.54" pandas numpy lxml
      - name: Daten laden
        shell: python
        run: |
          import os, time, tarfile, pandas as pd, yfinance as yf
          print("yfinance", yf.__version__)
          watch = ["SE","HIMS","NOW","INTU","CRWV","NBIS","MELI","IREN","NFLX","AAPL","ASTS","SOFI",
                   "NVDA","MSFT","AMZN","META","GOOGL","TSLA","AMD","PLTR","JPM","LLY","XOM","COST"]
          extra = ["ADBE","CRM","ORCL","AVGO","QCOM","TXN","INTC","CSCO","IBM","UBER","SHOP","PYPL","COIN","ROKU",
                   "SNOW","DDOG","NET","CRWD","ZS","PANW","MU","AMAT","LRCX","MRVL","SMCI","DELL","HD","NKE","SBUX",
                   "MCD","KO","PEP","WMT","DIS","BA","CAT","GE","GS","BAC","V","MA","UNH","JNJ","PFE","MRK","ABBV",
                   "CVX","OXY","RIVN","DKNG","ABNB","MSTR","RBLX","AFRM","UPST","ARM","APP","HOOD","RKLB","CELH"]
          alle = watch + extra + ["QQQ", "SPY", "EURUSD=X"]
          os.makedirs("td/kurse", exist_ok=True); os.makedirs("td/termine", exist_ok=True)
          fehlt = list(alle)
          for versuch in range(3):
              if not fehlt: break
              roh = yf.download(fehlt, period="max", interval="1d", auto_adjust=True, group_by="ticker",
                                progress=False, threads=True)
              rest = []
              for t in fehlt:
                  try:
                      df = roh[t].dropna(subset=["High", "Low", "Close"])
                  except Exception:
                      df = None
                  if df is None or df.empty:
                      rest.append(t); continue
                  df = df[df.index >= "2008-01-01"]
                  df.to_csv(f"td/kurse/{t}.csv", float_format="%.6g")
              fehlt = rest; time.sleep(5)
          print("ohne Kurse:", fehlt)
          ohne = []
          for t in watch + extra:
              df = None
              for versuch in range(3):
                  try:
                      df = yf.Ticker(t).get_earnings_dates(limit=100)
                      break
                  except Exception as e:
                      print(t, type(e).__name__, e); time.sleep(10)
              if df is None or len(df) == 0:
                  ohne.append(t)
              else:
                  df.to_csv(f"td/termine/{t}.csv")
              time.sleep(1.5)
          print("ohne Termine:", ohne)
          with tarfile.open("testdaten.tar.gz", "w:gz") as tar:
              tar.add("td", arcname="td")
          print("Größe:", os.path.getsize("testdaten.tar.gz"))
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -f testdaten.tar.gz
          git commit -m "Testdaten (vorübergehend)"
          git push
