# Sicherheits-Check: rechnet die Kaufregeln mit festen Kursdaten (tests/daten) und vergleicht mit dem gespeicherten
# Fingerabdruck (tests/fingerabdruck.json), dazu kleine Tests für Positionsgröße, Stop/Ziel/Limit, Quartalszahlen,
# Marktfilter, Branchen-Grenze und das Papier-Depot. Läuft bei jedem Pull Request und jedem Push auf main; schlägt
# ein Test fehl, ist der Pull Request rot. Eine absichtliche Regeländerung nur mit „python tests/fingerabdruck_neu.py“
# und deutlichem Hinweis im Pull Request. Der zweite Teil (bot-pakete) prüft dasselbe mit genau den Paketen des Bots.
name: Sicherheits-Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # wie beim Erzeugen des Fingerabdrucks
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Pakete installieren
        run: pip install -r tests/requirements.txt

      - name: Tests
        run: python -m pytest -q tests

  bot-pakete:
    # Dieselben Pakete und dieselbe Python-Version wie der Bot bei GitHub (requirements-bot.txt: feste Versionen mit
    # Prüfsummen). Prüft, dass die Installation klappt und die Tests auch mit genau diesen Paketen grün sind – wichtig,
    # wenn die Versionen einmal erneuert werden.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # wie swing-bot.yml und live.yml

      - name: Bot-Pakete installieren (mit Prüfsummen)
        run: pip install --require-hashes -r requirements-bot.txt

      - name: Tests mit den Bot-Paketen
        run: |
          pip install pytest==9.0.3
          python -m pytest -q tests
