# Strategie-Labor (die Nachtschicht): Mo–Fr gegen 23 Uhr deutscher Zeit sucht labor/strategie_labor.py mit
# Yahoo-Kursen ab 2010 nach einer Strategie für Tech-Aktien (long und short), prüft sie Walk-Forward (3 Jahre suchen,
# 1 unbekanntes Jahr handeln), lernt aus den Testjahren und schreibt Bericht, Ergebnis, Gedächtnis und das eigene
# Übungsdepot nach labor/. Nur Simulation mit Spielgeld, keine echten Orders. Swing-Bot, sein Übungsdepot und
# seine eingefrorenen Kaufregeln bleiben unberührt (anderer Ordner). Regeln und Ziel: labor/PROMPT.md.
name: Strategie-Labor

on:
  schedule:
    # 21:13 UTC = 23:13 Uhr (Sommerzeit) bzw. 22:13 Uhr (Winterzeit). Nicht zur vollen Stunde: Dann starten bei
    # GitHub die meisten geplanten Läufe, und der eigene kommt oft deutlich später.
    - cron: "13 21 * * 1-5"
  workflow_dispatch: # Knopf "Run workflow" im Tab Actions
    inputs:
      neuer_champion:
        description: "Übungsdepot des Labors mit dem heutigen Vorschlag neu starten"
        type: boolean
        default: false

permissions:
  contents: write # Bericht, Ergebnis, Gedächtnis und Übungsdepot in labor/ speichern

concurrency:
  group: strategie-labor # nie zwei Nachtschichten gleichzeitig (das Gedächtnis würde sich überschreiben)
  cancel-in-progress: false

jobs:
  nachtschicht:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - name: Pakete installieren
        run: pip install -r requirements-bot.txt

      - name: Labor rechnen
        id: labor
        env:
          NEU: ${{ inputs.neuer_champion }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -- --budget normal  # wie im Wettkampf gegen den Swing-Bot geprüft
          if [ "$NEU" = "true" ]; then set -- "$@" --neuer-champion; fi
          python labor/strategie_labor.py "$@"

      - name: Bericht in der Zusammenfassung anzeigen
        if: always()
        env:
          ERGEBNIS: ${{ steps.labor.outcome }}
        run: |
          if [ "$ERGEBNIS" != "success" ]; then
            echo "> ❌ Die Nachtschicht ist nicht fertig geworden – Details im Schritt „Labor rechnen“. Die nächste Nacht versucht es erneut." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f labor/BERICHT.md ]; then
            cat labor/BERICHT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ergebnis speichern
        if: steps.labor.outcome == 'success'
        run: |
          git config user.name "strategie-labor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A labor
          if git diff --cached --quiet; then
            echo "Nichts Neues zu speichern."
            exit 0
          fi
          git commit -m "Strategie-Labor: Nachtschicht $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then
              git push origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((versuch * 5))
          done
          echo "::error::Nicht gespeichert – meist, weil labor/ während des Laufs geändert wurde. Die nächste Nacht rechnet vom gespeicherten Stand weiter."
          exit 1
