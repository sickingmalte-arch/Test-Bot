# Vorwärts-Test „Gedeckter Call am Kursziel“ mit echten Optionspreisen (Wunsch des Nutzers vom 18.11.2026).
# Werktags während der US-Börsenzeit holt der Ablauf für jeden Kauf-Auftrag des Übungsdepots für heute den echten Call
# am Kursziel von Yahoo und vergleicht ihn mit der Rechnung aus dem Rückblick (forschung/optionen_vorwaerts.py).
# Nur Messung: Die Depots werden nur gelesen, gehandelt wird nichts.
name: Optionen-Vorwärts-Test

on:
  # Angestoßen wird der Test von der Live-Kette (live.yml) ab 10:15 Uhr New York, weil geplante Läufe oft Stunden zu
  # spät kommen. Der Zeitplan ist nur Reserve: 15:17 UTC = 16:17 Uhr deutscher Winterzeit, im Sommer 17:17 Uhr.
  schedule:
    - cron: "17 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optionen-vorwaerts
  cancel-in-progress: false

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lernen/requirements.txt
      - run: pip install --require-hashes -r lernen/requirements.txt
      - name: Echte Call-Preise am Kursziel holen
        env:
          PYTHONUNBUFFERED: "1"
        run: python forschung/optionen_vorwaerts.py
      - name: Speichern
        run: |
          git config user.name "forschungs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschung/optionen_vorwaerts.json forschung/OPTIONEN_VORWAERTS.md
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Forschungs-Bot: Optionen-Vorwärts-Test $(TZ=Europe/Berlin date '+%d.%m.%Y')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((versuch * 5))
          done
          exit 1
