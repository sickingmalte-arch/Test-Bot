# Broker-Bot: spiegelt das Übungsdepot des Swing-Bots in ein Alpaca-Paper-Konto (Spielgeld, echte Orders).
# Läuft nach jedem Morgen-Lauf des Swing-Bots (vor dem US-Börsenstart: Käufe zur Eröffnung bis zum Limit, Verkäufe
# zum Schlusskurs vor Quartalszahlen und am Zeitstopp), dazu zweimal nach dem Börsenstart (Stop und Ziel für frisch
# gekaufte Aktien). Ohne die Secrets ALPACA_KEY_ID und ALPACA_SECRET_KEY tut er nichts. Ohne die Variable
# BROKER_AN = ja nur Probelauf (Bericht, keine Orders). Not-Aus: BROKER_AN löschen oder auf nein setzen.
# Einrichtung: README, Abschnitt „Broker-Bot“.
name: Broker-Bot

on:
  workflow_run:
    workflows: ["Swing-Bot"]
    types: [completed]
    branches: [main]
  schedule:
    # 13:17 UTC: Ersatz, falls der Lauf nach dem Swing-Bot ausbleibt (vor 9:28 Uhr New York, Sommer wie Winter).
    # 14:47 und 15:47 UTC: nach dem Börsenstart (13:30 bzw. 14:30 UTC) Stop und Ziel für neue Positionen setzen.
    - cron: "17 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 15 * * 1-5"
  workflow_dispatch: # Knopf "Run workflow" im Tab Actions

permissions:
  contents: write # Bericht und Protokoll in broker/ speichern

concurrency:
  group: broker-bot # nie zwei Läufe gleichzeitig (Orders würden doppelt geprüft)
  cancel-in-progress: false

jobs:
  spiegeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # neuester Stand des Übungsdepots

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - name: Pakete installieren
        run: pip install -r requirements-bot.txt

      - name: Übungsdepot zu Alpaca spiegeln
        id: broker
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BROKER_AN: ${{ vars.BROKER_AN }}
          BROKER_MAX_ORDER: ${{ vars.BROKER_MAX_ORDER }}
          PYTHONUNBUFFERED: "1"
        run: python broker/broker_bot.py

      - name: Bericht in der Zusammenfassung anzeigen
        if: always()
        run: |
          if [ -f broker/BERICHT.md ] && [ -n "$(git status --porcelain broker)" ]; then
            cat broker/BERICHT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein neuer Bericht (Secrets fehlen oder Lauf abgebrochen – Details im Schritt davor)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ergebnis speichern
        if: steps.broker.outcome == 'success'
        run: |
          git config user.name "broker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A broker
          if git diff --cached --quiet; then
            echo "Nichts Neues zu speichern."
            exit 0
          fi
          git commit -m "Broker-Bot: Lauf $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then
              git push origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((versuch * 5))
          done
          echo "::error::Bericht nicht gespeichert. Die Orders sind trotzdem bei Alpaca – der nächste Lauf prüft den Stand neu."
          exit 1
