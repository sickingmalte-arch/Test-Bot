# Swing-Bot automatisch: am Morgen nach jedem US-Börsentag in der Cloud bei GitHub.
# Ergebnis: bericht/README.md (Signale, Papier-Depot, Rückblick), papier/papier_depot.json, das Gehirn für
# Obsidian in gehirn/ (Tagesnotiz, Trade-Tagebuch mit Lehren; der Bot liest gehirn/Meine Regeln.md) und die Daten der
# Übersichtsseite in docs/daten.json (veröffentlicht vom Ablauf uebersicht.yml).
# Einstellungen ohne Code ändern: Repository -> Settings -> Secrets and variables -> Actions ->
# Tab "Variables": KONTO (z. B. 10000), RISIKO (z. B. 1), TICKER (z. B. "AAPL, NFLX, SOFI"),
# OPTIONEN (nur Schalter wie "--ohne-short --ohne-news", siehe README).
name: Swing-Bot

on:
  schedule:
    # 6:47 UTC Di–Sa = 8:47 Uhr (Sommerzeit) bzw. 7:47 Uhr (Winterzeit) deutscher Zeit, jeweils für den
    # US-Handelstag davor. Nicht schon in der Nacht: Yahoo liefert die Tageskerze oft erst Stunden nach dem
    # US-Schluss, dann wären alle Signale einen Tag alt. GitHub startet geplante Läufe oft Minuten bis Stunden
    # später (am 23.10.2026 erst um 14:10 Uhr) – deshalb zwei Ersatz-Termine um 9:17 und 11:17 UTC, beide noch vor
    # dem US-Börsenstart. Ein Ersatz-Termin rechnet nur, wenn es heute noch keinen vollständigen Bericht gibt
    # (Job „pruefen“ unten); fehlten beim ersten Lauf noch Kurse, holt er sie nach.
    - cron: "47 6 * * 2-6"
    - cron: "17 9 * * 2-6"
    - cron: "17 11 * * 2-6"
  workflow_dispatch: # Knopf "Run workflow" im Tab Actions (rechnet immer)

permissions:
  contents: write # Bericht und Papier-Depot zurück ins Repository schreiben
  issues: write # bei Kauf-Signalen ein Kommentar im Thema „Swing-Bot: Signale“ (Nachricht aufs Handy)

concurrency:
  group: swing-bot # nie zwei Läufe gleichzeitig (das Papier-Depot würde sich sonst überschreiben)
  cancel-in-progress: false

jobs:
  pruefen:
    # Schon erledigt? Gibt es einen Bericht von heute (deutsche Zeit) mit Signal-Tabelle, ohne Fehler (❌) und ohne
    # die Warnung „Die Kurse vom … fehlen noch“, braucht ein geplanter Lauf nicht noch einmal zu rechnen. Von Hand
    # gestartet rechnet er immer.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fertig: ${{ steps.bericht.outputs.fertig }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: bericht
      - name: Bericht von heute vorhanden?
        id: bericht
        if: github.event_name == 'schedule'
        run: |
          heute=$(TZ=Europe/Berlin date '+%d.%m.%Y')
          if [ -f bericht/README.md ] && grep -q "^Stand: .* $heute " bericht/README.md \
              && grep -q "Daten bis" bericht/README.md && ! grep -q "^> ❌" bericht/README.md \
              && ! grep -q "fehlen noch" bericht/README.md; then
            echo "Heute ($heute) schon vollständig gelaufen – dieser Termin wird übersprungen."
            echo "fertig=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Noch kein vollständiger Bericht von heute ($heute) – der Bot rechnet."
          fi

  scan:
    needs: pruefen
    if: needs.pruefen.outputs.fertig != 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # neuester Stand des Zweigs (wartet ein Lauf auf den vorigen, sieht er dessen Papier-Depot)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - name: Pakete installieren
        run: pip install -r requirements-bot.txt

      - name: Claudes Entscheidungen holen
        # Claude-Depot (Versuch): Claude hält vor Börsenbeginn im Thema „🧠 Claude-Depot: Entscheidungen“ (Label
        # claude-depot) fest, welche Signale es auslässt. Es zählen nur Kommentare des Repository-Besitzers, mit dem
        # Zeitstempel von GitHub. Klappt das nicht, rechnet das Claude-Depot ohne neue Entscheidungen weiter.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BESITZER: ${{ github.repository_owner }}
        run: |
          datei="$RUNNER_TEMP/claude_entscheidungen.json"
          : > "$datei"
          nummer=$(gh issue list --repo "$GITHUB_REPOSITORY" --label claude-depot --state all --limit 100 \
            --json number --jq 'map(.number) | min // empty')
          if [ -z "$nummer" ]; then
            echo "Kein Thema mit dem Label claude-depot – keine Entscheidungen."
            exit 0
          fi
          # $ENV gehört zu jq (Filter in gh), nicht zur Shell
          # shellcheck disable=SC2016
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$nummer/comments" \
            --jq '.[] | select(.user.login == $ENV.BESITZER) | {created_at, updated_at, body}' > "$datei"
          echo "$(wc -l < "$datei") Kommentare von $BESITZER aus Thema #$nummer gelesen."

      - name: Bot laufen lassen
        id: bot
        env:
          KONTO: ${{ vars.KONTO || '10000' }}
          RISIKO: ${{ vars.RISIKO || '1' }}
          TICKER: ${{ vars.TICKER }}
          OPTIONEN: ${{ vars.OPTIONEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -- --konto "$KONTO" --risiko "$RISIKO" --rueckblick 12 \
                 --papier papier/papier_depot.json --bericht bericht/README.md --gehirn gehirn \
                 --nachricht "$RUNNER_TEMP/nachricht.md" \
                 --claude-depot papier/claude_depot.json --claude-entscheidungen "$RUNNER_TEMP/claude_entscheidungen.json" \
                 --uebersicht docs/daten.json
          if [ -n "$TICKER" ]; then set -- "$@" --ticker "$TICKER"; fi
          # OPTIONEN absichtlich ohne Anführungszeichen: mehrere Angaben durch Leerzeichen getrennt
          # shellcheck disable=SC2086
          python swing_scanner.py "$@" $OPTIONEN

      - name: Bericht in der Zusammenfassung anzeigen
        if: always()
        env:
          ERGEBNIS: ${{ steps.bot.outcome }}
        run: |
          case "$ERGEBNIS" in
            success) ;;
            failure) echo "> ❌ Der Bot ist mit einem Fehler abgebrochen – der Grund steht unten im Bericht, Details im Schritt Bot laufen lassen." ;;
            cancelled) echo "> ❌ Der Lauf wurde abgebrochen (von Hand oder nach 30 Minuten). Der nächste Lauf rechnet weiter." ;;
            *) echo "> ❌ Der Bot ist gar nicht gestartet: ein Schritt davor (z. B. Pakete installieren) ist fehlgeschlagen – Details dort. Der nächste Lauf versucht es erneut." ;;
          esac >> "$GITHUB_STEP_SUMMARY"
          # Nur einen Bericht dieses Laufs zeigen, nicht den vom letzten Mal
          if [ -f bericht/README.md ] && { [ "$ERGEBNIS" = "success" ] || [ "$ERGEBNIS" = "failure" ]; }; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat bericht/README.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ordner in papier bericht gehirn docs; do
            if [ -e "$ordner" ]; then git add -A "$ordner"; fi
          done
          if git diff --cached --quiet; then
            echo "Nichts Neues zu speichern."
            exit 0
          fi
          git commit -m "Swing-Bot: Bericht $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME"; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((versuch * 5))
          done
          echo "::error::Nicht gespeichert – meist, weil papier/, bericht/, gehirn/ oder docs/ während des Laufs geändert wurde (z. B. Datei hochgeladen). Sonst steht der Grund im Protokoll darüber (z. B. Zweigschutz oder GitHub-Störung). Der nächste Lauf rechnet vom gespeicherten Stand weiter."
          exit 1

      - name: Nachricht aufs Handy
        # Bei Kauf-Signalen ein Kommentar im Thema „📲 Swing-Bot: Signale“ (Tab Issues). GitHub schickt dir dazu eine
        # E-Mail und – mit der GitHub-App – eine Push-Nachricht. Klappt das nicht, bleibt der Lauf trotzdem grün.
        if: always() && steps.bot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BESITZER: ${{ github.repository_owner }}
          BERICHT: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/bericht/README.md
        run: |
          datei="$RUNNER_TEMP/nachricht.md"
          if [ ! -s "$datei" ]; then
            echo "Kein Signal – keine Nachricht."
            exit 0
          fi
          { echo; echo "Ganzer Bericht: $BERICHT"; echo; echo "@$BESITZER"; } >> "$datei"
          gh label create swing-bot-signale --repo "$GITHUB_REPOSITORY" --color 1F883D \
            --description "Nachrichten des Swing-Bots" 2>/dev/null || true
          nummer=$(gh issue list --repo "$GITHUB_REPOSITORY" --label swing-bot-signale --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$nummer" ]; then
            nummer=$(gh issue create --repo "$GITHUB_REPOSITORY" --label swing-bot-signale \
              --title "📲 Swing-Bot: Signale" \
              --body "Hier schreibt der Bot nach jedem Lauf mit Kauf-Signal einen Kommentar. GitHub schickt dir dazu eine E-Mail und – mit der GitHub-App – eine Push-Nachricht aufs Handy. Keine Nachrichten mehr: rechts auf Unsubscribe klicken. Wird dieses Thema geschlossen, legt der Bot beim nächsten Signal ein neues an." \
              | grep -o '[0-9]*$')
          fi
          # Dieselbe Nachricht nicht zweimal schicken: Ein von Hand gestarteter Lauf und der (oft Stunden verspätete)
          # geplante Lauf haben meist dieselben Kurse. Verglichen wird mit dem letzten Kommentar des Bots; klappt das
          # Lesen nicht, wird die Nachricht wie bisher geschickt.
          anzahl=$(gh api "repos/$GITHUB_REPOSITORY/issues/$nummer" --jq '.comments' 2>/dev/null || echo 0)
          seite=$(( (anzahl + 99) / 100 ))
          letzte=""
          if [ "$seite" -gt 0 ]; then
            letzte=$(gh api "repos/$GITHUB_REPOSITORY/issues/$nummer/comments?per_page=100&page=$seite" \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // ""' 2>/dev/null || true)
          fi
          gleich() { tr -d '\r' | sed -e 's/[[:space:]]*$//'; }
          if [ -n "$letzte" ] && [ "$(printf '%s' "$letzte" | gleich)" = "$(gleich < "$datei")" ]; then
            echo "Gleiche Nachricht wie zuletzt – nicht noch einmal geschickt."
            exit 0
          fi
          gh issue comment "$nummer" --repo "$GITHUB_REPOSITORY" --body-file "$datei"
