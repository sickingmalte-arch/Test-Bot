# Forschungs-Bot (siehe forschung/README.md). Zwei Aufgaben:
# 1) Experimentier-Depot: nach jedem Morgen-Lauf des Bots handelt ein eigenes Übungsdepot mit Spielgeld eine Idee
#    (forschung/experiment.json) – zum Vergleich mit dem Übungsdepot, auch auf der Webseite (docs/forschung.json).
#    Haupt-Depot und Claude-Depot werden dabei nur gelesen.
# 2) Prüfstand: Liegt eine neue Idee in forschung/ideen/, rechnet GitHub den ehrlichen Rückblick (2010–2026, echter
#    Bot, Watchlist, mit Gebühr und Spread) und legt das Ergebnis in forschung/ergebnisse/ ab. Das Rechnen kostet
#    kein Claude-Limit. Eingebaut wird eine Idee nur per Pull Request nach deinem „Ja“.
name: Forschungs-Bot

on:
  workflow_run:
    workflows: [Swing-Bot]
    types: [completed]
  push:
    branches-ignore: [main] # auf main kommen Ideen nur per Pull Request – schon getestet
    paths: [forschung/ideen/**]
  workflow_dispatch:
    inputs:
      idee:
        description: "Nur Prüfstand: Dateiname in forschung/ideen/ (z. B. meine_idee.py) – leer = Experimentier-Depot"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: forschung-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  depot:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.idee == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install --require-hashes -r requirements-bot.txt
      - name: Experimentier-Depot weiterrechnen
        env:
          KONTO: ${{ vars.KONTO || '10000' }}
          RISIKO: ${{ vars.RISIKO || '1' }}
          GEBUEHR: ${{ vars.GEBUEHR || '0' }}
          TICKER: ${{ vars.TICKER }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -- --konto "$KONTO" --risiko "$RISIKO" --gebuehr "$GEBUEHR"
          if [ -n "$TICKER" ]; then set -- "$@" --ticker "$TICKER"; fi
          python forschung/experiment.py "$@"
      - name: Speichern
        run: |
          git config user.name "forschungs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschung/experiment_depot.json forschung/BERICHT.md docs/forschung.json
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Forschungs-Bot: Experimentier-Depot $(TZ=Europe/Berlin date '+%d.%m.%Y')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((versuch * 5))
          done
          exit 1

  pruefen:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.idee != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lernen/requirements.txt
      - run: pip install --require-hashes -r lernen/requirements.txt
      - name: Kursdaten aus dem Zwischenspeicher des Lern-Laufs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lern_cache
          key: lernen-forschung-${{ github.run_id }}
          restore-keys: lernen-
      - name: Ideen testen
        env:
          TICKER: ${{ vars.TICKER }}
          GEBUEHR: ${{ vars.GEBUEHR || '0' }}
          IDEE: ${{ inputs.idee }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$IDEE" ]; then
            ideen="forschung/ideen/$(basename "$IDEE")"
          else
            ideen=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'forschung/ideen/*.py' | grep -v '/beispiel_' || true)
          fi
          if [ -z "$ideen" ]; then echo "Keine neue Idee."; exit 0; fi
          for datei in $ideen; do
            name=$(basename "$datei" .py)
            # schon getestet (z. B. Branch nach dem Übernehmen neu von main): nicht noch einmal rechnen
            if [ -z "$IDEE" ] && [ -f "forschung/ergebnisse/$name.json" ]; then echo "$name: schon getestet"; continue; fi
            python forschung/pruefstand.py "$datei" --cache lern_cache
          done
      - name: Ergebnis speichern
        run: |
          git config user.name "forschungs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschung/ergebnisse
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Forschungs-Bot: Ergebnis vom Prüfstand"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME"; then git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((versuch * 5))
          done
          exit 1
