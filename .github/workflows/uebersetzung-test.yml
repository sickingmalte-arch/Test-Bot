# NUR ZUM TEST (wird wieder gelöscht): Schlagzeilen mit und ohne Umschreiben übersetzen lassen
name: Uebersetzung-Test
on:
  push:
    branches: [claude/new-session-hbq1tg]
    paths: [.github/workflows/uebersetzung-test.yml]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        art: [vorher, nachher]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Übersetzen
        env:
          ART: ${{ matrix.art }}
        run: |
          cat > beispiele.txt <<'ENDE'
          Hims & Hers stock pops on new weight-loss drug
          Hims & Hers Stock Falls After FDA Warning
          Johnson & Johnson stock rises on strong drug sales
          Is AST SpaceMobile Stock a Buy Now?
          Is Nvidia Stock a Buy Before Earnings?
          Should You Buy Palantir Stock Now?
          Tesla stock tanks after deliveries miss
          Apple stock hits record high as iPhone sales surge
          Sea Limited Stock Jumps After Shopee Profit Beat
          SoFi Technologies Hikes Full-Year Outlook
          Fed Rate Hikes Weigh On Bank Stocks
          Nebius Group Soars On New Nvidia Deal
          Netflix stock soared after subscriber growth
          Intuit Raises Annual Forecast On Strong TurboTax Demand
          Meta Platforms Faces EU Fine Over Data Use
          Cathie Wood-Led Ark Invest Sells PLTR, GOOG, SHOP Stocks — But Loads Up On PACB, FRNM And Other Biotech Firms
          Berkshire Trims Its Apple Stake Again
          Netflix Tops Estimates But Guidance Disappoints
          Palantir Slides After Earnings; Is The Bull Case Broken?
          Microsoft Stock Market Value Tops $4 Trillion
          Amazon Stock And Other Mega Cap Tech Names For The AI Infrastructure Reset
          MercadoLibre Stock Price Target Raised At Goldman
          CoreWeave Shares Tank After Microsoft Cuts Orders
          ENDE
          python3 - <<'ENDE'
          import html, json, os, re, time, urllib.parse, urllib.request
          src = open("swing_scanner.py", encoding="utf-8").read()
          ns = {"re": re, "html": html, "json": json, "time": time, "urllib": urllib}
          exec(src[src.index("UEBERSETZER ="):src.index("def werte_news")], ns)
          if os.environ["ART"] == "vorher":
              ns["klartext"] = lambda t: t
              ns["NACHBESSERN"].clear()
          texte = [z.strip() for z in open("beispiele.txt", encoding="utf-8") if z.strip()]
          d = ns["auf_deutsch"](texte, zeitlimit=120)
          for t in texte:
              print(t)
              print("   ->", d.get(t, "(nicht übersetzt)"))
          ENDE
