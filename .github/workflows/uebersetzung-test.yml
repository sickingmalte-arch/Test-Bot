name: Übersetzung-Test (temporär)
on:
  push:
    branches: [claude/new-session-hbq1tg]
    paths: [forschung_tmp/uebersetzung_test.py, .github/workflows/uebersetzung-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - run: python forschung_tmp/uebersetzung_test.py
