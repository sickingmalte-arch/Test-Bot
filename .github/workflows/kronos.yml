# Kronos-Versuch nach vorne (siehe forschung/kronos_versuch.py): Nach jedem Morgen-Lauf des Bots rechnet die KI Kronos
# für neue Kauf-Signale je 50 mögliche Zukünfte aus (4 Varianten: small-256, small-64, small-64 mit mehr Zufall, das größere
# base-256 für die ersten 3 Signale), dazu täglich alle Aktien der Watchlist mit den beiden schnellen Varianten (Stop/Ziel
# ±2 ATR); nach 20 Handelstagen Vergleich mit echten Kursen (Richtung und Schwankung).
# Nur eine Messung – der Bot kauft und verkauft nicht danach. Die Depots werden nie angefasst.
# Sicherheit: Gerechnet wird ohne Schreibrechte (fremder Modellcode liegt fest im Repo, von Hugging Face kommen nur die
# Gewichte); gespeichert wird in einem eigenen Schritt, der nur die vier Ergebnis-Dateien übernimmt (zwei Logs, Bericht,
# docs/kronos.json für die Webseite – die Übersichtsseite wird danach neu veröffentlicht).
name: Kronos-Versuch

on:
  workflow_run:
    workflows: [Swing-Bot]
    types: [completed]
  workflow_dispatch:
  push:
    branches-ignore: [main] # Probelauf auf dem Arbeits-Branch: rechnet, speichert aber nichts im Repo
    paths: [forschung/kronos_versuch.py, forschung/kronos_modell/**, forschung/kronos_requirements.txt, .github/workflows/kronos.yml]

permissions:
  contents: read

concurrency:
  group: kronos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rechnen:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      noetig: ${{ steps.pruefen.outputs.noetig }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Pakete (feste Versionen mit Prüfsummen)
        run: pip install --require-hashes -r forschung/kronos_requirements.txt
      - name: Gibt es etwas zu tun?
        id: pruefen
        env:
          PROBE: ${{ github.event_name == 'push' && '--probe' || '' }}
        run: python forschung/kronos_versuch.py --modus pruefen $PROBE | tee -a "$GITHUB_OUTPUT"
      - name: torch (nur für den Prozessor, ohne Grafikkarte; seine Abhängigkeiten sind schon installiert)
        if: steps.pruefen.outputs.noetig == 'true'
        run: |
          pip install --no-deps torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip check # bricht ab, falls torch doch ein Paket fehlt
      - name: Modell-Gewichte aus dem Zwischenspeicher
        if: steps.pruefen.outputs.noetig == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: kronos-gewichte-v2 # small + base
      - name: Kronos rechnen und auswerten
        if: steps.pruefen.outputs.noetig == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PROBE: ${{ github.event_name == 'push' && '--probe' || '' }}
        run: |
          mkdir -p ergebnis
          python forschung/kronos_versuch.py --modus lauf $PROBE --ausgabe ergebnis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.pruefen.outputs.noetig == 'true'
        with:
          name: kronos-ergebnis
          path: ergebnis/
          retention-days: 14

  speichern:
    needs: rechnen
    if: needs.rechnen.outputs.noetig == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # Übersichtsseite starten (siehe letzter Schritt)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kronos-ergebnis
          path: ergebnis
      - name: Speichern (nur die vier Ergebnis-Dateien)
        run: |
          cp ergebnis/kronos_log.json forschung/kronos_log.json
          cp ergebnis/kronos_liste_log.json forschung/kronos_liste_log.json
          cp ergebnis/kronos_ergebnis.md forschung/kronos_ergebnis.md
          cp ergebnis/kronos.json docs/kronos.json
          git config user.name "kronos-versuch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschung/kronos_log.json forschung/kronos_liste_log.json forschung/kronos_ergebnis.md docs/kronos.json
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Kronos-Versuch: $(TZ=Europe/Berlin date '+%d.%m.%Y')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((versuch * 5))
          done
          exit 1
      - name: Übersichtsseite neu veröffentlichen
        # Hat der Morgen-Lauf des Bots diesen Lauf gestartet, startet GitHub danach keine Folge-Abläufe – die Seite käme
        # sonst erst mit dem nächsten Lauf. Deshalb hier ausdrücklich starten.
        if: github.triggering_actor == 'github-actions[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uebersicht.yml --repo "$GITHUB_REPOSITORY" --ref main
