# Kronos-Versuch nach vorne (siehe forschung/kronos_versuch.py): Nach jedem Morgen-Lauf des Bots rechnet die KI Kronos
# für neue Kauf-Signale je 50 mögliche Zukünfte aus (4 Varianten: small-256, small-64, small-64 mit mehr Zufall, das größere
# base-256 für die ersten 3 Signale); nach 20 Handelstagen Vergleich mit echten Kursen (Richtung und Schwankung).
# Nur eine Messung – der Bot kauft und verkauft nicht danach. Die Depots werden nie angefasst.
# Sicherheit: Gerechnet wird ohne Schreibrechte (fremder Modellcode liegt fest im Repo, von Hugging Face kommen nur die
# Gewichte); gespeichert wird in einem eigenen Schritt, der nur die drei Ergebnis-Dateien übernimmt (Log, Bericht,
# docs/kronos.json für die Webseite – die Übersichtsseite wird danach neu veröffentlicht).
name: Kronos-Versuch

on:
  workflow_run:
    workflows: [Swing-Bot]
    types: [completed]
  workflow_dispatch:
  push:
    branches-ignore: [main] # Probelauf auf dem Arbeits-Branch: rechnet, speichert aber nichts im Repo
    paths: [forschung/kronos_versuch.py, forschung/kronos_modell/**, forschung/kronos_requirements.txt, .github/workflows/kronos.yml]

permissions:
  contents: read

concurrency:
  group: kronos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rechnen:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      noetig: ${{ steps.pruefen.outputs.noetig }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kleine Pakete für die Prüfung
        run: pip install numpy pandas==2.2.2
      - name: Gibt es etwas zu tun?
        id: pruefen
        env:
          PROBE: ${{ github.event_name == 'push' && '--probe' || '' }}
        run: python forschung/kronos_versuch.py --modus pruefen $PROBE | tee -a "$GITHUB_OUTPUT"
      - name: Pakete (torch nur für den Prozessor, ohne Grafikkarte)
        if: steps.pruefen.outputs.noetig == 'true'
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r forschung/kronos_requirements.txt
      - name: Modell-Gewichte aus dem Zwischenspeicher
        if: steps.pruefen.outputs.noetig == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-gewichte-v2 # small + base
      - name: Kronos rechnen und auswerten
        if: steps.pruefen.outputs.noetig == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PROBE: ${{ github.event_name == 'push' && '--probe' || '' }}
        run: |
          mkdir -p ergebnis
          python forschung/kronos_versuch.py --modus lauf $PROBE --ausgabe ergebnis
      - uses: actions/upload-artifact@v4
        if: steps.pruefen.outputs.noetig == 'true'
        with:
          name: kronos-ergebnis
          path: ergebnis/
          retention-days: 14

  speichern:
    needs: rechnen
    if: needs.rechnen.outputs.noetig == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: kronos-ergebnis
          path: ergebnis
      - name: Speichern (nur die drei Ergebnis-Dateien)
        run: |
          cp ergebnis/kronos_log.json forschung/kronos_log.json
          cp ergebnis/kronos_ergebnis.md forschung/kronos_ergebnis.md
          cp ergebnis/kronos.json docs/kronos.json
          git config user.name "kronos-versuch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschung/kronos_log.json forschung/kronos_ergebnis.md docs/kronos.json
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Kronos-Versuch: $(TZ=Europe/Berlin date '+%d.%m.%Y')"
          for versuch in 1 2 3 4; do
            if git pull --rebase --quiet origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $((versuch * 5))
          done
          exit 1
