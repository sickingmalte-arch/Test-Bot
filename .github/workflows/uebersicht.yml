# Übersichtsseite (docs/index.html + docs/daten.json) bei GitHub Pages veröffentlichen.
# Einmalig einschalten: Repository -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Die Seite liegt dann unter https://<Benutzername>.github.io/<Repository>/ und ist öffentlich (wie das Repository).
name: Übersichtsseite

on:
  workflow_run: # nach jedem Lauf des Bots (er speichert neue Daten in docs/daten.json) und nach dem Kronos-Versuch (docs/kronos.json)
    workflows: ["Swing-Bot", "Kronos-Versuch"]
    types: [completed]
  push: # wenn die Seite selbst geändert wird
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch: # Knopf "Run workflow" im Tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    # Kronos-Probeläufe auf Arbeits-Branches speichern nichts – dann nichts neu veröffentlichen
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Kronos-Versuch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # neuester Stand – auch nach einem Bot-Lauf, der seine Daten gerade gespeichert hat

      - name: Live-Kurse behalten
        # docs/live.json legt live.yml nur in die veröffentlichte Seite (keine Commits). Ohne diesen Schritt löscht jedes
        # Veröffentlichen hier (nach dem Morgen-Lauf oder einer Änderung an der Seite) den Live-Teil, bis der nächste
        # Live-Lauf kommt. Alte Live-Kurse zeigt die Seite nicht an (nur, wenn sie neuer sind als die Daten vom Morgen).
        continue-on-error: true
        env:
          SEITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if curl -fsS --max-time 20 "$SEITE/live.json?t=$(date +%s)" -o "$RUNNER_TEMP/live.json" \
              && python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/live.json"; then
            mv "$RUNNER_TEMP/live.json" docs/live.json
            echo "Live-Kurse der veröffentlichten Seite übernommen."
          else
            echo "Keine Live-Kurse veröffentlicht – die Seite zeigt den Stand vom Morgen."
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Seite veröffentlichen
        id: seite
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
